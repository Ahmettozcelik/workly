name: Backend CI

on:
  pull_request:
    branches: [main]
    paths: ["pom.xml", "mvnw", ".mvn/**", "src/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["pom.xml", "mvnw", ".mvn/**", "src/**", ".github/workflows/backend-ci.yml"]

# A new push to a PR cancels its previous run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Compiles and runs all tests. The integration tests start PostgreSQL 17
      # with Testcontainers on the runner's Docker; no database service or
      # secrets are needed.
      - run: ./mvnw -B -ntp verify

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14
