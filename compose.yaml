
services:
  postgres:
    image: postgres:17-alpine
    container_name: workly-postgres
    environment:
      POSTGRES_DB: workly
      POSTGRES_USER: workly
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workly -d workly"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local mail catcher: the backend sends to SMTP localhost:1025, and every mail
  # (e.g. verification links) shows up at http://localhost:8025. Nothing leaves
  # this machine. Only on localhost, no authentication needed.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: workly-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
