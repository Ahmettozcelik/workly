spring:
  application:
    name: workly

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/workly
    username: workly
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  session:
    # Idle timeout; the session row expires in PostgreSQL after it.
    timeout: 12h
    jdbc:
      # The SPRING_SESSION tables come from Flyway (V2__create_spring_session.sql).
      initialize-schema: never

  mail:
    # Dev: Mailpit from compose.yaml (SMTP 1025, mails visible on http://localhost:8025).
    # Without it, sending fails and is logged; registration still works.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    default-encoding: UTF-8
    properties:
      # Milliseconds: a slow or unreachable server cannot hold a request for long.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  # Client address and scheme from X-Forwarded-* when the request comes from a
  # trusted proxy (Tomcat's internal-proxies: localhost and private networks,
  # i.e. the Next.js server). Used by the per-address limits (AddressRateLimits).
  forward-headers-strategy: native

workly:
  auth:
    throttle:
      # Per email (unknown emails too): this many failed sign-ins within the
      # window block sign-in for that email for the block duration (LoginThrottle).
      login-email:
        max-failures: 5
        window: 15m
        block: 15m
      # Per client address, a second layer (AddressRateLimits).
      login-address:
        max-requests: 20
        window: 1m
      register-address:
        max-requests: 10
        window: 1h
    verification:
      # The frontend origin the mailed link points to: {base-url}/{locale}/verify-email?token=…
      base-url: ${APP_BASE_URL:http://localhost:3000}
      token-lifetime: 24h
      # Per signed-in member asking for a new link; every limit applies.
      resend-limits:
        - max-requests: 1
          window: 1m
        - max-requests: 5
          window: 1h
      # Per verified member whose email someone registers with again: the
      # "account exists" mail (registration answers the same either way).
      existing-account-limit:
        max-requests: 1
        window: 15m

  mail:
    # Sender address of Workly's mails (prod: MAIL_FROM).
    from: ${MAIL_FROM:no-reply@workly.local}

  session:
    # Secure attribute of the session cookie (WORKLY_SESSION, HttpOnly, SameSite=Lax;
    # SessionCookieConfig) and the XSRF-TOKEN cookie (SameSite=Lax; SecurityConfig).
    # False only for local http://localhost; the prod profile fixes it to true.
    cookie-secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # Mail is not needed to serve requests; an SMTP outage must not mark the
      # app DOWN (readiness checks, the Full-stack E2E workflow).
      enabled: false
